# 在 Nginx 的 http 配置中包含此文件，设置实际域名并配置 HTTPS。
limit_req_zone $binary_remote_addr zone=bus_query:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=bus_query_connections:10m;

server {
    listen 80;
    server_name bus.example.com;
    access_log off;
    error_log /var/log/nginx/bus-query-error.log crit;

    location /api/ {
        limit_req zone=bus_query burst=20 nodelay;
        limit_req_status 429;
        limit_conn bus_query_connections 12;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
